name: tw-stock-daily

on:
  # 由 cron-job.org 於台灣週一~五 16:41 準時觸發(GitHub 內建排程常延遲,已移除)
  workflow_dispatch:
    inputs:
      force:
        description: "force send"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: sudo apt-get update -y && sudo apt-get install -y fonts-wqy-microhei

      - run: python main.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_SEND: ${{ inputs.force }}

      - run: python chips.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_SEND: ${{ inputs.force }}
